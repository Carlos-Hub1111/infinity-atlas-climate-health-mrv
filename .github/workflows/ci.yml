name: Baseline CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: baseline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci.db
      AUTO_CREATE_TABLES: "false"
      AUTO_SEED_DEMO_DATA: "false"
      DEMO_DATA_IS_SYNTHETIC: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall app

      - name: Run backend automated tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Verify production startup does not seed demo data
        working-directory: .
        shell: bash
        run: |
          if grep -q "python -m app.seed" backend/Dockerfile; then
            echo "Backend Docker startup must not seed demo data automatically."
            exit 1
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build
